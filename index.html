<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
<script defer src="/odin-weather-app/main.js"></script></head>
<body class="">
  <div id="main">

    <form id="form" action="#">
      <input type="text" id="input" placeholder="Search...">
      <span class="error-msg"></span>
    </form>
    <div id="loading" class="hide">Loading...</div>
    <div class="content">
      <h1 class="locate"></h1>
      <div class="date"></div>
      <div class="temperature"></div>
      <div class="condition">
        <div class="condition-icon">
        </div>
        <p class="condition-msg"></p>
      </div>
      <div class="footer">
        <div >
          Visible
          <span class="visible"></span>
        </div>
        <div >
          Wind speed
          <span class="wind"></span>
        </div>
        <div >
          Cloud over
          <span class="cloud"></span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
